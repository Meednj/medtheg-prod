spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/medtheg_prod
    username: medtheg
    password: medtheg_dev_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/payment/success}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/payment/cancel}