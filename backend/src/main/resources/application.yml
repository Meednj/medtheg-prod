spring:
  profiles:
    active: dev

  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/medtheg_prod
    username: medtheg
    password: medtheg_dev_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/payment/success}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/payment/cancel}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:medtheg}
  secret-key: ${MINIO_SECRET_KEY:medtheg_minio_password}
  bucket: ${MINIO_BUCKET:medtheg-assets}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
